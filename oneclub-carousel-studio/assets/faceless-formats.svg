    <rect x="26" y="82" width="146" height="40" rx="8" fill="#a3f0af" opacity="0.14"/>
    <path d="M108 96 l26 22 -11 3 6 13 -7 3 -6 -13 -9 7z" fill="#a3f0af"/>
