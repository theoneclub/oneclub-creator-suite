<!doctype html>
<html lang="en" data-ready="0">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../../../ds-bundle-morphe/carousel.css">
</head>
<body>
  <div class="slide slide--value" id="slide">
    
    <main class="body">
      <div class="kicker">The loop</div>
      <h2>Four moves, on repeat.</h2>
      <div class="flow flow--v">
        <div class="step" style="--row-accent:var(--green)">
          <div class="k">01</div>
          <div class="t">Batch ten posts</div>
          <div class="s">One sitting, one format</div>
        </div>
        <div class="arw">&rarr;</div>
        <div class="step" style="--row-accent:var(--yellow)">
          <div class="k">02</div>
          <div class="t">Publish daily</div>
          <div class="s">No editing the plan mid-week</div>
        </div>
        <div class="arw">&rarr;</div>
        <div class="step" style="--row-accent:var(--green-soft)">
          <div class="k">03</div>
          <div class="t">Read the data</div>
          <div class="s">Saves and comments, not likes</div>
        </div>
        <div class="arw">&rarr;</div>
        <div class="step" style="--row-accent:var(--green)">
          <div class="k">04</div>
          <div class="t">Repeat the winner</div>

        </div>
      </div>
    </main>
    <footer class="foot">
      <span class="handle">@theoneclub</span>
      <span class="bar"><i style="width:60%"></i></span>
      <span class="count">03 / 05</span>
    </footer>
  </div>
<script>
/* Auto-fit: shrink type until the body stops overflowing.
   Records the final scale so the QA pass can flag slides that hit the floor. */
(function () {
  var FLOOR = 0.62, STEP = 0.02;
  function fit() {
    var slide = document.getElementById('slide');
    var body  = slide.querySelector('.body');
    var scale = 1;
    slide.style.setProperty('--fit', scale);
    var guard = 0;
    var over = function () {
      return body.scrollHeight > body.clientHeight + 1 || body.scrollWidth > body.clientWidth + 1;
    };
    while (over() && scale > FLOOR && guard++ < 40) {
      scale = Math.round((scale - STEP) * 100) / 100;
      slide.style.setProperty('--fit', scale);
    }
    /* a short block floating at the top reads as a mistake — centre it.
       (scrollHeight is never < clientHeight, so measure the children.) */
    var kids = body.children;
    var contentH = kids.length
      ? (kids[kids.length - 1].offsetTop + kids[kids.length - 1].offsetHeight) - kids[0].offsetTop
      : 0;
    if (contentH < body.clientHeight * 0.82) body.classList.add('body--centred');

    var root = document.documentElement;
    root.dataset.fit = String(scale);
    root.dataset.overflow  = body.scrollHeight > body.clientHeight + 1 ? '1' : '0';
    root.dataset.overflowX = body.scrollWidth  > body.clientWidth  + 1 ? '1' : '0';
    root.dataset.ready = '1';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  else window.addEventListener('load', fit);
})();
</script>
</body>
</html>
