<!doctype html>
<html lang="en" data-ready="0">
<head>
<meta charset="utf-8">
<title>permission-slip — slide 4</title>
<link rel="stylesheet" href="../../../ds-bundle-morphe/fonts/fonts.css">
<link rel="stylesheet" href="../../../ds-bundle-morphe/tokens.css">
<link rel="stylesheet" href="../../../ds-bundle-morphe/carousel.css">
</head>
<body>
  <div class="slide slide--value" id="slide">
    
    <main class="body">
      <div class="kicker">Recurring vs one-time</div>
      <h2><span class="hl">Recurring</span> compounds.<br>One-time doesn't.</h2>
      <div class="panel">
        <div class="cap">Four referrals · still paying you at month 12</div>
        <div class="stat" style="--row-accent:var(--green)">
          <div class="lab">Recurring</div>
          <div class="track"><div class="fill" style="width:100%"></div></div>
          <div class="val">4</div>
        </div>
        <div class="stat stat--muted" style="--row-accent:var(--yellow)">
          <div class="lab">One-time</div>
          <div class="track"><div class="fill" style="width:2%"></div></div>
          <div class="val">0</div>
        </div>
      </div>
      <div class="pull">Four referrals on a recurring model can cover your own membership — and keep covering it.</div>
    </main>
    <footer class="foot">
      <span class="handle">@theoneclub</span>
      <span class="bar"><i style="width:44%"></i></span>
      <span class="count">04 / 09</span>
    </footer>
  </div>
<script>
/* Auto-fit: shrink type until the body stops overflowing.
   Records the final scale so the QA pass can flag slides that hit the floor. */
(function () {
  var FLOOR = 0.62, STEP = 0.02;
  function fit() {
    var slide = document.getElementById('slide');
    var body  = slide.querySelector('.body');
    var scale = 1;
    slide.style.setProperty('--fit', scale);
    var guard = 0;
    while (body.scrollHeight > body.clientHeight + 1 && scale > FLOOR && guard++ < 40) {
      scale = Math.round((scale - STEP) * 100) / 100;
      slide.style.setProperty('--fit', scale);
    }
    /* a short block floating at the top reads as a mistake — centre it.
       (scrollHeight is never < clientHeight, so measure the children.) */
    var kids = body.children;
    var contentH = kids.length
      ? (kids[kids.length - 1].offsetTop + kids[kids.length - 1].offsetHeight) - kids[0].offsetTop
      : 0;
    if (contentH < body.clientHeight * 0.82) body.classList.add('body--centred');

    var root = document.documentElement;
    root.dataset.fit = String(scale);
    root.dataset.overflow  = body.scrollHeight > body.clientHeight + 1 ? '1' : '0';
    root.dataset.overflowX = body.scrollWidth  > body.clientWidth  + 1 ? '1' : '0';
    root.dataset.ready = '1';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  else window.addEventListener('load', fit);
})();
</script>
</body>
</html>
